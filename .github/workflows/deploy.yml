name: Deploy to Pi Zero
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "clases/**"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via HTTP tunnel
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          PI_URL: ${{ secrets.PI_URL }}
        run: |
          if [ -z "$PI_URL" ] || [ -z "$DEPLOY_TOKEN" ]; then
            echo "Faltan secrets PI_URL y DEPLOY_TOKEN"
            exit 1
          fi
          echo "Desplegando a $PI_URL/api/deploy"
          curl -s -X POST "$PI_URL/api/deploy" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"$DEPLOY_TOKEN\"}" | tee /tmp/deploy.json
          cat /tmp/deploy.json
          if ! grep -q "deploy iniciado" /tmp/deploy.json; then
            echo "Deploy falló"
            exit 1
          fi
          echo "Esperando reinicio..."
          for i in 1 2 3 4 5; do sleep 5; echo "Intento $i/5"; curl -s "$PI_URL/" | grep -q "CEAER" && echo "OK index" && break; done
          curl -s "$PI_URL/" | grep -q "CEAER" && echo "OK index final" || exit 1
          for i in 1 2 3; do curl -s "$PI_URL/clase4" | grep -q "Clase 4" && echo "OK clase4" && break; sleep 3; done
          curl -s "$PI_URL/clase4" | grep -q "Clase 4" && echo "OK clase4 final" || exit 1
      - name: Lint
        run: |
          python3 -m py_compile dashboard/servidor_datos.py
          echo "HTML lines:"; wc -l dashboard/*.html
          if grep -P -q '[\x{1F300}-\x{1FAFF}]' dashboard/dashboard_clase4.html; then echo "ERROR emojis"; exit 1; fi

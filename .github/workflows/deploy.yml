name: Deploy to Pi Zero

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "clases/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Rsync to Pi
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
          PI_PASS: ${{ secrets.PI_PASS }}
        run: |
          sshpass -p "$PI_PASS" rsync -avz -e "ssh -o StrictHostKeyChecking=no" dashboard/ "$PI_USER@$PI_HOST:/home/nico/dashboard/"

      - name: Restart server
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
          PI_PASS: ${{ secrets.PI_PASS }}
        run: |
          sshpass -p "$PI_PASS" ssh -o StrictHostKeyChecking=no "$PI_USER@$PI_HOST" bash <<'EOS'
            set -e
            pkill -f servidor_datos.py || true
            sleep 1
            setsid python3 -u /home/nico/dashboard/servidor_datos.py > /tmp/c8000.log 2>&1 < /dev/null &
            sleep 2
            ss -tlnp | grep 8000
            curl -s http://127.0.0.1:8000/ | grep -q "CEAER" && echo "OK index" || exit 1
            curl -s http://127.0.0.1:8000/clase4 | grep -q "Clase 4" && echo "OK clase4" || exit 1
          EOS

      - name: Lint checks
        run: |
          python3 -m py_compile dashboard/servidor_datos.py
          echo "HTML check"
          for f in dashboard/*.html; do echo " $f $(wc -l < "$f") lines"; done
          # sin emojis en dashboards
          if grep -P -q '[\x{1F300}-\x{1FAFF}]' dashboard/dashboard_clase4.html; then echo "ERROR: emojis en dashboard_clase4.html"; exit 1; fi
          echo "No emojis ✓"

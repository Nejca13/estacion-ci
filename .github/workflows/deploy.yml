name: Deploy to Pi Zero
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "clases/**"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Deploy via Tailscale (tailnet)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          PI_TAILNET: "100.121.34.122"
        run: |
          echo "Desplegando a http://$PI_TAILNET:8000/api/deploy"
          curl -s -X POST "http://$PI_TAILNET:8000/api/deploy" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"$DEPLOY_TOKEN\"}" | tee /tmp/deploy.json
          cat /tmp/deploy.json
          grep -q "deploy iniciado" /tmp/deploy.json || exit 1
          echo "Esperando auto-restart del servidor (~15s, Pi Zero ARM11 es lenta)..."
          sleep 15
          echo "Verificando..."
          for i in 1 2 3 4 5 6 7 8; do sleep 4; curl -s -m 5 "http://$PI_TAILNET:8000/" | grep -q "CEAER" && echo "OK index" && break; echo "Intento $i/8"; done
          curl -s -m 5 "http://$PI_TAILNET:8000/" | grep -q "CEAER" && echo "OK index final" || exit 1
          curl -s -m 5 "http://$PI_TAILNET:8000/clase4" | grep -q "Clase 4" && echo "OK clase4" || exit 1
          curl -s -m 5 "http://$PI_TAILNET:8000/historico" | grep -q "Historial" && echo "OK historico" || exit 1
      - name: Lint
        run: |
          python3 -m py_compile dashboard/servidor_datos.py
          python3 -m py_compile dashboard/mongo_manager.py
          wc -l dashboard/*.html
          if grep -P -q '[\x{1F300}-\x{1FAFF}]' dashboard/dashboard_clase4.html; then echo "ERROR emojis"; exit 1; fi

